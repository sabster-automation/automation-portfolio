name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      env:
        description: 'Environment to run tests against'
        required: true
        default: 'staging'
        type: choice
        options: [dev, staging, prod]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', github.event.inputs.env)) || fromJSON('["dev","staging"]') }}
        project: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        run: ENV=${{ matrix.env }} npx playwright test --project=${{ matrix.project }} --reporter=html,allure-playwright,junit
        env:
          ENV: ${{ matrix.env }}
          CI: true
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.env }}-${{ matrix.project }}
          path: playwright-report/
          retention-days: 30
      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results-${{ matrix.env }}-${{ matrix.project }}
          path: allure-results/
          retention-days: 30
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results-${{ matrix.env }}-${{ matrix.project }}
          path: test-results/
          retention-days: 30

  visual:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Check visual baselines
        id: baselines
        run: |
          if find tests/visual -type d -name '*-snapshots' 2>/dev/null | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No visual baselines under tests/visual. Run Actions → Update Visual Baselines on main, then re-run this job."
          fi
      - uses: actions/setup-node@v4
        if: steps.baselines.outputs.present == 'true'
        with:
          node-version: 20
          cache: 'npm'
      - if: steps.baselines.outputs.present == 'true'
        run: npm ci
      - if: steps.baselines.outputs.present == 'true'
        run: npx playwright install --with-deps chromium
      - name: Run Visual Regression
        if: steps.baselines.outputs.present == 'true'
        run: npx playwright test --project=visual
        env:
          ENV: dev
          CI: true
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.baselines.outputs.present == 'true' }}
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/

  api:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Run API tests
        run: ENV=dev npx playwright test --project=api
